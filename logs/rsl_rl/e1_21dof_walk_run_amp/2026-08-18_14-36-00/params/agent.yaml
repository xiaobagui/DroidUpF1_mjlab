seed: 42
num_steps_per_env: 24
max_iterations: 50000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 100
experiment_name: e1_21dof_walk_run_amp
run_name: ''
logger: tensorboard
resume: true
load_run: 2026-08-18_11-57-11
load_checkpoint: model_6000.pt
clip_actions: null
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: rsl_rl.modules:GaussianDistribution
    init_std: 1.0
    std_type: scalar
    std_range: !!python/tuple
    - 0.05
    - 2.0
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: rsl_rl.models:MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: rsl_rl.models:MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    data_augmentation_func: src.tasks.amp.symmetry:data_augmentation_func
    use_mirror_loss: true
    mirror_loss_coeff: 0.1
  amp_motion_files: !!python/tuple
  - dataset/e1_21dof/amp/walk.npz
  - dataset/e1_21dof/amp/run.npz
  - dataset/e1_21dof/amp/run_mirror.npz
  amp_motion_velocity_threshold: 0.8
  amp_motion_slow_weights: !!python/tuple
  - 0.9
  - 0.05
  - 0.05
  amp_motion_fast_weights: !!python/tuple
  - 0.1
  - 0.45
  - 0.45
  amp_reward_coefficient: 0.4
  amp_task_reward_lerp: 0.7
  amp_discriminator_hidden_dims: !!python/tuple
  - 1024
  - 512
  - 256
  amp_replay_buffer_size: 100000
  amp_preload_transitions: 500000
  amp_transition_dt: 0.02
  amp_gradient_penalty: 10.0
  minimum_action_std: !!python/tuple
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  class_name: src.tasks.amp.rl.algorithm:AmpPPO
